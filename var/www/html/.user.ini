; =============================================================================
; PHP-FPM per-directory upload size overrides
; Deployed to: /var/www/html/.user.ini
;
; PHP-FPM scans for .user.ini files in the directory containing each requested
; PHP file and all parent directories up to the document root. Settings placed
; here apply to every PHP request served from /var/www/html/, covering all
; WordPress admin, REST API, and front-end upload flows.
;
; NOTE: upload_max_filesize and post_max_size are PHP_INI_PERDIR entries that
; CANNOT be changed at runtime via ini_set() — they must live here (or in
; php.ini / a FPM pool .conf).  Web access to this file is blocked by the
; Apache common-settings.conf <Files "\.ini$"> deny rule.
;
; These values mirror the nginx per-route body-size limits:
;   /wp-admin/update.php          → client_max_body_size 64m
;   /wp-admin/async-upload.php    → client_max_body_size 100m
;   /wp-json/wp/v2/media          → client_max_body_size 100m
;
; upload_max_filesize: individual file cap — set to 100M to cover the media
;   upload ceiling (videos, audio).  Gutenberg plugin ZIPs (~35 MB) are well
;   inside this value.
;
; post_max_size: total POST body cap — must exceed upload_max_filesize to
;   leave room for multipart boundary, form fields, and chunk overhead.
;   105M provides ~5M of headroom above the 100M file cap.
;
; Cloudflare hard cap: 100 MB per request (free/pro plans).  No value here
; should exceed that limit.
; =============================================================================

upload_max_filesize = 100M
post_max_size       = 105M
