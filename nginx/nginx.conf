# =============================================================================
# NGINX — PERIMETER LAYER
# Role: Real IP restore, protocol sanity, security headers, origin rate-limiting
# Receives trusted edge requests from Cloudflare (TLS already terminated).
# Forwards clean requests to Varnish on port 6081.
# =============================================================================

user  www-data;
worker_processes  auto;

worker_rlimit_nofile 65535;

load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_stream_geoip2_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# Load any dynamic modules enabled by the distro/package manager from
# /etc/nginx/modules-enabled/. Note: any directives used later in this config
# still require their corresponding modules to be installed and loaded
# (for example, Brotli directives require the Brotli module).
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {

    # KERNEL & WORKER OPTIMIZATION
    # ----------------------------------------------------------------------
    # IMPORTANT: map_hash_bucket_size MUST appear before all map{} blocks.
    # On nginx 1.24+, the first map{} initialises the hash internally; any
    # explicit map_hash_bucket_size after that is treated as a duplicate.
    map_hash_bucket_size 128;
    map_hash_max_size    4096;
    variables_hash_bucket_size 128;
    variables_hash_max_size    4096;
    
    # Drop connections immediately on timeout or flood (Ghosting Protocol)
    reset_timedout_connection on;
    limit_conn_status 444;  # Ghost flooders
    limit_req_status  444;  # Ghost brute-forcers
    
    # Hardening against request smuggling and invalid headers
    ignore_invalid_headers on;
    underscores_in_headers off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Load modular logic maps and trust definitions early.
    include /etc/nginx/conf.d/*.conf;

    # -------------------------------------------------------------------------
    # Logging — include CF-Connecting-IP, country, UA, block reason, and
    # request trace ID so Fail2Ban, log parsers, and distributed tracing can
    # correlate entries across layers.
    #
    # Field notes:
    #   real_ip          — TCP connection IP restored by real_ip_from/CF-Connecting-IP
    #                      processing.  This is the field Fail2Ban rules must use.
    #   cf_connecting_ip — raw CF-Connecting-IP header (kept for cross-reference;
    #                      matches real_ip when traffic comes through Cloudflare).
    #   trace_id         — Nginx-generated unique request ID ($request_id);
    #                      forward as X-Request-ID to correlate across Varnish /
    #                      Apache / application logs.
    # -------------------------------------------------------------------------
    log_format sparxstar_telemetry
                    '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'real_ip="$remote_addr" '
                    'cf_connecting_ip="$http_cf_connecting_ip" '
                    'country="$http_cf_ipcountry" '
                    'trace_id="$request_id" '
                    'host="$host" '
                    'block_reason="$block_reason"';

    access_log  /var/log/nginx/access.log  sparxstar_telemetry;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens  off;

    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;

    large_client_header_buffers 4 32k;
    
    # -------------------------------------------------------------------------
    # Default body size limit — applies to all routes not explicitly handled.
    # Individual locations override this:
    #   /wp-admin/update.php    → client_max_body_size 64m  (plugin/theme ZIP uploads)
    #   /wp-admin/async-upload.php → client_max_body_size 100m (media uploads)
    #   /wp-json/wp/v2/media    → client_max_body_size 100m (REST API media uploads)
    #   /files/                 → client_max_body_size 0   (unlimited, TUS resumable uploads)
    #   /graphql                → client_max_body_size 50m
    #   /submission             → client_max_body_size 100m
    # The existing production config used 500M globally; 10M is a safer default
    # for unhandled routes while still allowing reasonable API payloads.
    # -------------------------------------------------------------------------
    client_max_body_size 10m;

    # -------------------------------------------------------------------------
    # Brotli
    # -------------------------------------------------------------------------
    brotli              on;
    brotli_static       on;
    brotli_comp_level   6;
    brotli_min_length   256;
    brotli_types
    application/atom+xml
    application/javascript
    application/json
    application/rss+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-font-opentype
    application/x-font-truetype
    application/x-javascript
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/eot
    font/opentype
    font/otf
    image/svg+xml
    image/x-icon
    image/vnd.microsoft.icon
    text/css
    text/plain
    text/javascript
    text/x-component;

    # -------------------------------------------------------------------------
    # Gzip
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
        
    # Compression level (1-9)
    gzip_comp_level     6;

    # Don't compress anything under 256 bytes
    gzip_min_length     256;

    # Compress output of these MIME-types
    gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/rss+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-font-opentype
    application/x-font-truetype
    application/x-javascript
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/eot
    font/opentype
    font/otf
    image/svg+xml
    image/x-icon
    image/vnd.microsoft.icon
    text/css
    text/plain
    text/javascript
    text/x-component;

    # Disable gzip for bad browsers
    gzip_disable  "MSIE [1-6]\.(?!.*SV1)";
        
    # -------------------------------------------------------------------------
    # Real IP Restoration — Cloudflare IP ranges.
    # set_real_ip_from / real_ip_header / real_ip_recursive are defined in
    # /etc/nginx/conf.d/spx-cloudflare-trust.conf (auto-generated, do not
    # edit manually).  That file is included above via conf.d/*.conf.
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # Event Horizon ownership:
    # - Cloudflare origin gate maps (for example $spx_from_cloudflare)
    # - Worker secret trust maps and SPARXSTAR pass-through maps
    # This repository consumes those variables but does not redefine them.
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # GeoIP country signal and bot-mitigation maps ($block_geo, $ua_block_type,
    # $empty_ua_geo_block, $block_reason) are defined in
    # /etc/nginx/conf.d/spx-bot-mitigation-logic.conf and loaded above via
    # conf.d/*.conf.  The $block_reason variable is further refined per-request
    # by set/if directives in the server block (for legacy browser signals).
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # Certificate and key file maps ($cert_file, $key_file) are defined in
    # /etc/nginx/conf.d/spx-certs-logic.conf and loaded above via conf.d/*.conf.
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # Rate-limiting zones — origin-safe inner guard only.
    # Cloudflare handles public-facing generic flood/brute-force limits.
    # -------------------------------------------------------------------------
    limit_req_zone  $spx_real_ip  zone=spx_wp_login:10m   rate=10r/m;
    limit_req_zone  $spx_real_ip  zone=spx_graphql:10m    rate=300r/m;
    limit_req_zone  $spx_real_ip  zone=spx_submission:10m rate=20r/m;
    limit_req_zone  $spx_real_ip  zone=spx_general:20m    rate=30r/s;
    limit_req_zone  $spx_real_ip  zone=spx_wp_admin:10m   rate=40r/s;
            
    # -------------------------------------------------------------------------
    # Upstream backends
    # -------------------------------------------------------------------------
    upstream varnish_backend {
        server 127.0.0.1:6081;
        keepalive 32;
    }
    
    upstream tus_node_backend {
        server 127.0.0.1:1080;
        keepalive 8;
    }
    
    include /etc/nginx/sites-enabled/*;    
}
