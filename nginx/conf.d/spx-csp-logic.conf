# =============================================================================
# spx-csp-logic.conf — Content-Security-Policy
#
# Single unified policy applied to all hosts on this Nginx instance.
#
# Design decisions:
#   • One policy governs all vhosts — no per-host map entries.  If a host
#     genuinely requires a tighter policy in the future, add a named entry
#     above the default and document the reason.
#   • 'unsafe-inline' is required in script-src and style-src because
#     WordPress core, WooCommerce, and active plugins inject inline scripts
#     and styles.  Removing these directives would break page rendering.
#     Nonce/hash adoption requires changes at the WordPress application layer
#     and is a future hardening milestone, not an Nginx concern.
#   • 'unsafe-eval' is retained in script-src because several active plugins
#     (analytics, maps, payment SDKs) use eval() internally.
#   • media-src covers self-hosted uploads across all network domains
#     (*.sparxstar.com, *.aiwestafrica.com, aiwestafrica.com,
#     casanovaandrosetta.com) as well as third-party streaming embeds.
#     MP4, WebM, and audio formats are all covered by this directive.
#   • frame-src includes docs.google.com to support published Google Docs
#     and Google Slides embeds — a deliberate platform content feature.
#   • img-src includes aiwestafrica.com (bare) in addition to the wildcard
#     because WordPress multisite can serve images from the root domain.
#   • casanovaandrosetta.com receives the same permissions as aiwestafrica.com
#     across CSP directives for scripts, styles, media, frames, images, and connect.
#   • frame-ancestors is intentionally narrower to reduce clickjacking risk;
#     Google Slides embedding is enabled via frame-src docs.google.com.
# =============================================================================

map "" $spx_csp_src_common {
  default "'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com";
}

map "" $spx_csp_src_script {
  default "$spx_csp_src_common 'unsafe-inline' 'unsafe-eval' blob: data: https://analytics.wpmucdn.com https://static.cloudflareinsights.com https://www.clarity.ms https://www.googletagmanager.com https://www.google.com https://www.gstatic.com https://s.ytimg.com https://www.youtube.com https://js.hs-scripts.com https://js.hs-analytics.net https://js.hs-banner.com https://js.hsforms.net https://js.hscollectedforms.net https://pixel.byspotify.com https://open.spotify.com https://js.stripe.com https://connect-js.stripe.com https://*.js.stripe.com https://checkout.stripe.com https://maps.googleapis.com https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com https://checkout.flutterwave.com https://stats.wp.com";
}

map "" $spx_csp_src_style {
  default "$spx_csp_src_common 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net https://*.paypal.com https://*.paypalobjects.com";
}

map "" $spx_csp_src_connect {
  default "$spx_csp_src_common https://cdn2.sparxstar.com https://cdn4.sparxstar.com https://cdn8.sparxstar.com https://analytics3.wpmudev.com https://wp-stats.wpmudev.com https://pagead2.googlesyndication.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://j.clarity.ms https://c.clarity.ms https://www.googletagmanager.com https://stats.g.doubleclick.net https://forms.hsforms.com https://forms.hscollectedforms.net https://api.hubspot.com https://track.hubspot.com https://evnt.byspotify.com https://api.stripe.com https://checkout.stripe.com https://*.stripe.com https://maps.googleapis.com https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com https://api.flutterwave.com https://checkout.flutterwave.com";
}

map "" $spx_csp_src_font {
  default "$spx_csp_src_common data: https://db.onlinewebfonts.com https://fonts.gstatic.com https://fonts.bunny.net https://js.stripe.com";
}

map "" $spx_csp_src_frame {
  default "$spx_csp_src_common https://www.googletagmanager.com https://www.google.com https://docs.google.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://open.spotify.com https://app.hubspot.com https://forms.hsforms.com https://*.js.stripe.com https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://connect-js.stripe.com https://*.paypal.com https://*.paypalobjects.com https://checkout.flutterwave.com blob:";
}

map "" $spx_csp_src_img {
  default "$spx_csp_src_common data: blob: https://cdn4.sparxstar.com https://cdn8.sparxstar.com https://c.clarity.ms https://i.ytimg.com https://i.vimeocdn.com https://f.vimeocdn.com https://www.google.com https://www.gstatic.com https://stats.g.doubleclick.net https://track.hubspot.com https://forms.hsforms.com https://*.hubspotusercontent-na1.net https://*.stripe.com https://*.paypal.com https://*.paypalobjects.com https://pixel.wp.com https://secure.gravatar.com https://*.wp.com https://s.w.org";
}

map "" $spx_csp_src_media {
  default "$spx_csp_src_common https://cdn4.sparxstar.com https://cdn8.sparxstar.com https://open.spotify.com https://www.youtube.com https://player.vimeo.com blob:";
}

map "" $spx_csp_src_worker {
  default "$spx_csp_src_common blob:";
}

map "" $spx_csp_src_frame_ancestors {
  default "'self' https://*.sparxstar.com https://sparxstar.com";
}

map $host $spx_csp {
  default "default-src $spx_csp_src_common; script-src $spx_csp_src_script; style-src $spx_csp_src_style; object-src $spx_csp_src_common; base-uri $spx_csp_src_common; connect-src $spx_csp_src_connect; font-src $spx_csp_src_font; frame-ancestors $spx_csp_src_frame_ancestors; frame-src $spx_csp_src_frame; img-src $spx_csp_src_img; manifest-src $spx_csp_src_common; media-src $spx_csp_src_media; worker-src $spx_csp_src_worker;";
}
