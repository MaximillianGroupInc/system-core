# =============================================================================
# spx-csp-logic.conf — Content-Security-Policy
#
# Single unified policy applied to all hosts on this Nginx instance.
#
# Design decisions:
#   • One policy governs all vhosts — no per-host map entries.  If a host
#     genuinely requires a tighter policy in the future, add a named entry
#     above the default and document the reason.
#   • 'unsafe-inline' is required in script-src and style-src because
#     WordPress core, WooCommerce, and active plugins inject inline scripts
#     and styles.  Removing these directives would break page rendering.
#     Nonce/hash adoption requires changes at the WordPress application layer
#     and is a future hardening milestone, not an Nginx concern.
#   • 'unsafe-eval' is retained in script-src because several active plugins
#     (analytics, maps, payment SDKs) use eval() internally.
#   • media-src covers self-hosted uploads across all network domains
#     (*.sparxstar.com, *.aiwestafrica.com, aiwestafrica.com,
#     casanovaandrosetta.com) as well as third-party streaming embeds.
#     MP4, WebM, and audio formats are all covered by this directive.
#   • frame-src includes docs.google.com to support published Google Docs
#     and Google Slides embeds — a deliberate platform content feature.
#   • img-src includes aiwestafrica.com (bare) in addition to the wildcard
#     because WordPress multisite can serve images from the root domain.
#   • casanovaandrosetta.com receives the same permissions as aiwestafrica.com
#     across all directives — media, frames, images, and connect.
# =============================================================================

map $host $spx_csp {

  default "default-src 'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com; script-src 'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com 'unsafe-inline' 'unsafe-eval' blob: data: https://analytics.wpmucdn.com https://static.cloudflareinsights.com https://www.clarity.ms https://www.googletagmanager.com https://www.google.com https://www.gstatic.com https://s.ytimg.com https://www.youtube.com https://js.hs-scripts.com https://js.hs-analytics.net https://js.hs-banner.com https://js.hsforms.net https://js.hscollectedforms.net https://pixel.byspotify.com https://open.spotify.com https://js.stripe.com https://connect-js.stripe.com https://*.js.stripe.com https://checkout.stripe.com https://maps.googleapis.com https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com https://checkout.flutterwave.com https://stats.wp.com; style-src 'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net https://*.paypal.com https://*.paypalobjects.com; object-src 'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com; base-uri 'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com; connect-src 'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com https://cdn2.sparxstar.com https://cdn4.sparxstar.com https://cdn8.sparxstar.com https://analytics3.wpmudev.com https://wp-stats.wpmudev.com https://pagead2.googlesyndication.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://j.clarity.ms https://c.clarity.ms https://www.googletagmanager.com https://stats.g.doubleclick.net https://forms.hsforms.com https://forms.hscollectedforms.net https://api.hubspot.com https://track.hubspot.com https://evnt.byspotify.com https://api.stripe.com https://checkout.stripe.com https://*.stripe.com https://maps.googleapis.com https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com https://api.flutterwave.com https://checkout.flutterwave.com; font-src 'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com data: https://db.onlinewebfonts.com https://fonts.gstatic.com https://fonts.bunny.net https://js.stripe.com; frame-ancestors 'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com; frame-src 'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com https://www.googletagmanager.com https://www.google.com https://docs.google.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://open.spotify.com https://app.hubspot.com https://forms.hsforms.com https://*.js.stripe.com https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://connect-js.stripe.com https://*.paypal.com https://*.paypalobjects.com https://checkout.flutterwave.com blob:; img-src 'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com data: blob: https://cdn4.sparxstar.com https://cdn8.sparxstar.com https://c.clarity.ms https://i.ytimg.com https://i.vimeocdn.com https://f.vimeocdn.com https://www.google.com https://www.gstatic.com https://stats.g.doubleclick.net https://track.hubspot.com https://forms.hsforms.com https://*.hubspotusercontent-na1.net https://*.stripe.com https://*.paypal.com https://*.paypalobjects.com https://pixel.wp.com https://secure.gravatar.com https://*.wp.com https://s.w.org; manifest-src 'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com; media-src 'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com https://cdn4.sparxstar.com https://cdn8.sparxstar.com https://open.spotify.com https://www.youtube.com https://player.vimeo.com blob:; worker-src 'self' https://*.sparxstar.com https://sparxstar.com https://*.aiwestafrica.com https://aiwestafrica.com https://casanovaandrosetta.com blob:;";

