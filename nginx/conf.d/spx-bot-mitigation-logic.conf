# 1. Load the GeoIP2 Country database and expose the ISO country code.
geoip2 /var/lib/GeoIP/GeoLite2-Country.mmdb {
    auto_reload 5m;
    $geoip2_data_country_code country iso_code;
}

# 2. Define High-Risk Geo Logic (Africa block example)
map $geoip2_data_country_code $block_geo {
    default 0;
    # List ISO codes for high-risk countries here
    NG 1; # Nigeria
    EG 1; # Egypt
    GH 1; # Ghana
    RU 1; # Russia
    CN 1; # China
    VN 1; # Vietnam
    SG 1; # Singapore
    MY 1; # Malaysia
    MM 1; # Myanmar
    BY 1; # Belarus
    IR 1; # Iran
    IQ 1; # Iraq
    SY 1; # Syria
    IN 1; # India
    PK 1; # Pakistan
    AF 1; # Afghanistan
    KP 1; # North Korea
    IL 1; # Israel
    UA 1; # Ukraine
    BR 1; # Brazil
    TR 1; # Turkey
    ID 1; # Indonesia
    BD 1; # Bangladesh
    # Add others as needed
}

# 3. User Agent Block Logic (Same as before)
map $http_user_agent $ua_block_type {
    default 0;
    "~*(\n|\r|<|>|{|}|%0A|%0D|sqlmap|nikto|dirbuster|masscan|nmap)" 1;
}

# UA parity verification notes (must stay aligned with server block checks in
# nginx/sites-available/system-core.conf):
# - "Nikto/2.5.0"            => $ua_block_type=1 and server scanner_ua branch
# - "Mozilla\r\nX-Test: 1"   => $ua_block_type=1 and server ua_header_injection
# - "Opera Mini/7.5"         => server legacy browser branch (not map scanner)

# 4. Combined logic for Empty UA + High Risk Geo
map "$block_geo:$http_user_agent" $empty_ua_geo_block {
    default      0;
    "1:"         1; 
}

# 5. Final Block Reason mapping
# "" (empty string) means "no block" — consistent with the != "" checks in
# the server/location block rules that enforce $block_reason.
map "$ua_block_type:$empty_ua_geo_block" $block_reason {
    "1:0"        "malformed_or_scanner";
    "0:1"        "empty_ua_high_risk_geo";
    "1:1"        "malformed_or_scanner";
    default      "";
}

# 6. Hard-block subset used by upload handlers.
# Upload routes may bypass soft UA/geo-only signals to reduce false positives,
# but must still enforce hard security blocks (scanner/header-injection/legacy UA).
map $block_reason $hard_block_reason {
    default                  $block_reason;
    "empty_user_agent"       "";
    "empty_ua_high_risk_geo" "";
}
