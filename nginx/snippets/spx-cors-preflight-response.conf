# =============================================================================
# Shared CORS preflight response — included inside every
#   if ($request_method = OPTIONS) { ... }
# block in nginx/sites-available/system-core.conf.
#
# Per-route values ($cors_preflight_methods, $cors_preflight_allow_headers,
# $cors_preflight_expose_headers) are driven by maps declared in
# /etc/nginx/conf.d/spx-cors-logic.conf so that per-route changes only ever
# require editing that one file.
#
# nginx suppresses add_header when the value is an empty string, so
# Access-Control-Expose-Headers is only emitted for routes whose map entry
# is non-empty (currently only /files/ for TUS).
#
# IMPORTANT: This snippet is included inside if ($request_method = OPTIONS)
# blocks. Nginx does not inherit add_header directives from parent contexts
# inside if blocks, so preflight responses must explicitly set all required
# security headers here.
# =============================================================================
add_header Strict-Transport-Security         "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options            "nosniff"                                     always;
add_header X-Frame-Options                   "SAMEORIGIN"                                  always;
add_header Referrer-Policy                   "strict-origin-when-cross-origin"             always;
add_header X-XSS-Protection                  "0"                                           always;
add_header Cross-Origin-Opener-Policy        "same-origin"                                 always;
add_header Cross-Origin-Resource-Policy      "cross-origin"                                always;
add_header X-Permitted-Cross-Domain-Policies "none"                                        always;
add_header Permissions-Policy                $spx_permissions                              always;
add_header Content-Security-Policy           $spx_csp                                      always;
add_header Access-Control-Allow-Origin      $cors_origin                   always;
add_header Access-Control-Allow-Credentials $cors_credentials              always;
add_header Access-Control-Allow-Methods     $cors_preflight_methods        always;
add_header Access-Control-Allow-Headers     $cors_preflight_allow_headers  always;
add_header Access-Control-Expose-Headers    $cors_preflight_expose_headers always;
add_header Access-Control-Max-Age           86400                          always;
return 204;
